<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Skin - ចូលប្រើប្រាស់</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- របារ MENU ខាងលើ -->
    <header>
        <a href="index.html" class="logo">GLOW<span>SKIN</span></a>
        <nav>
            <ul>
                <li><a href="index.html">ទំព័រដើម</a></li>
                <li><a href="category.html">ផលិតផល</a></li>
                <li><a href="about.html">អំពីយើង</a></li>
                <li><a href="contact.html">ទំនាក់ទំនង</a></li>
                <li><a href="login.html" class="login-btn">ចូលប្រើ</a></li>
            </ul>
        </nav>
    </header>

    <!-- ផ្នែកទម្រង់ Login ស្ថិតនៅចំកណ្តាល -->
    <main class="login-container">
        <div class="login-card">
            <h2>ចូលប្រើប្រាស់</h2>
            <p class="login-subtitle">សូមបញ្ចូលគណនីរបស់អ្នកដើម្បីបន្ត</p>
            
            <form action="#" method="POST">
                <div class="form-group-login">
                    <label for="username">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                    <input type="text" id="username" placeholder="បញ្ចូល Username" required>
                </div>

                <div class="form-group-login">
                    <label for="password">លេខសម្ងាត់ (Password)</label>
                    <input type="password" id="password" placeholder="បញ្ចូល Password" required>
                </div>

                <button type="submit" class="btn-login-submit">Login</button>
            </form>
        </div>
    </main>

    <!-- FOOTER ខាងក្រោម -->
    <footer>
        <p>&copy; 2026 GLOW SKIN. រក្សាសិទ្ធិគ្រប់យ៉ាងសម្រាប់គម្រោង Mid-Term</p>
    </footer>

</body>
</html>
