<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Skin - ទំនាក់ទំនង</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">GLOW<span>SKIN</span></a>
        <nav>
            <ul>
                <li><a href="index.html">ទំព័រដើម</a></li>
                <li><a href="category.html">ផលិតផល</a></li>
                <li><a href="about.html">អំពីយើង</a></li>
                <li><a href="contact.html" class="active">ទំនាក់ទំនង</a></li>
                <li><a href="login.html" class="login-btn">ចូលប្រើ</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <h2>ទំនាក់ទំនងមកយើង</h2>
            <p>ផ្ញើសារមកយើងខ្ញុំ ប្រសិនបើអ្នកមានចម្ងល់ ឬត្រូវការការប្រឹក្សាអំពីស្បែក</p>
        </div>

        <div class="contact-container">
            <form id="contactForm">
                <div class="form-group">
                    <label>ឈ្មោះពេញ</label>
                    <input type="text" placeholder="វាយឈ្មោះរបស់អ្នកនៅទីនេះ" required>
                </div>
                <div class="form-group">
                    <label>អ៊ីមែល</label>
                    <input type="email" placeholder="ឧទាហរណ៍៖ name@email.com" required>
                </div>
                <div class="form-group">
                    <label>សារ/ចម្ងល់</label>
                    <textarea placeholder="សរសេរសំណួររបស់អ្នក..." rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-main">ផ្ញើសារចេញ</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GLOW SKIN. រក្សាសិទ្ធិគ្រប់យ៉ាងសម្រាប់គម្រោង Mid-Term</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
